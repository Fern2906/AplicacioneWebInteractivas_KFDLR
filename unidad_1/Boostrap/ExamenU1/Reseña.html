<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MovieReviews - Reseña</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="Index.html"><i class="bi bi-film"></i> Movie<span class="text-primary">Reviews</span></a>
  <div class="d-flex align-items-center gap-2">
    <a class="nav-link text-white" href="Index.html"><i class="bi bi-house"></i> Inicio</a>
    <button id="btnFavoritos" class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#modalFavoritos">
      <i class="bi bi-heart"></i> Favoritos <span id="contadorFavoritos" class="badge bg-danger">0</span>
    </button>
  </div>
</nav>

<div class="container py-4">

  <div id="spinner" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2">Cargando información...</p>
  </div>

  <div id="error" class="text-center py-5 d-none">
    <p class="text-danger">No se encontró la película solicitada.</p>
    <a href="Index.html" class="btn btn-primary btn-sm">Volver a inicio</a>
  </div>

  <div id="contenido" class="row d-none">
    <div class="col-md-4 mb-3">
      <img id="imgPoster" class="img-fluid rounded poster-detalle w-100" src="" alt="poster">
    </div>
    <div class="col-md-8">
      <div class="d-flex justify-content-between align-items-start">
        <h2 id="titulo"></h2>
        <button id="btnFavoritoDetalle" class="btn btn-outline-danger btn-sm"><i class="bi bi-heart"></i> Favorito</button>
      </div>
      <p class="text-muted">
        <span id="anio"></span> &nbsp;<i class="bi bi-clock"></i> <span id="duracion"></span> min &nbsp;
        <span class="badge bg-secondary" id="clasificacion"></span>
      </p>

      <h3 class="text-warning"><span id="rating"></span> <span id="estrellas"></span></h3>
      <p class="text-muted" id="votos"></p>

      <p><strong>Géneros:</strong> <span id="generos"></span></p>

      <p class="fst-italic border-start border-3 ps-2" id="descripcion"></p>

      <p><strong>Intereses:</strong> <span id="intereses"></span></p>

      <div class="mb-2" id="bloqueMetascore">
        <strong>Metascore:</strong> <span id="metascoreTexto"></span>
        <div class="barra-metascore"><span id="barraMetascore"></span></div>
      </div>

      <div class="row">
        <div class="col-6"><strong>Idiomas:</strong> <span id="idiomas"></span></div>
        <div class="col-6"><strong>Países:</strong> <span id="paises"></span></div>
        <div class="col-6"><strong>Presupuesto:</strong> <span id="presupuesto"></span></div>
        <div class="col-6"><strong>Recaudación:</strong> <span id="recaudacion"></span></div>
      </div>
      <p class="mt-2"><strong>Productoras:</strong> <span id="productoras"></span></p>

      <a id="btnTrailer" href="#" target="_blank" class="btn btn-danger btn-sm"><i class="bi bi-play-fill"></i> Ver tráiler</a>
      <a href="Index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>

      <p class="mt-3 mb-1"><strong>Enlaces externos:</strong></p>
      <div id="enlaces"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalFavoritos" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-heart-fill text-danger"></i> Mis Favoritos <span id="contadorFavoritos2" class="badge bg-danger"></span></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row" id="listaFavoritos"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
        <button id="btnEliminarTodos" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i> Eliminar todos</button>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
let pelicula = null;

function formatearDinero(n) {
  if (n === null || n === undefined) return 'N/A';
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return '$' + (n / 1000).toFixed(0) + 'K';
  return '$' + n;
}

function estrellas(rating) {
  const r = Math.round((rating || 0) / 2);
  let html = '';
  for (let i = 1; i <= 5; i++) html += `<i class="bi ${i <= r ? 'bi-star-fill' : 'bi-star'}"></i>`;
  return html;
}

function imagenURL(img) {
  if (!img) return null;
  return typeof img === 'string' ? img : img.url;
}

function nombresDe(lista) {
  return (lista || []).map(x => (typeof x === 'string' ? x : x.name)).join(', ');
}

function generarResena(p) {
  pelicula = p;
  $('#imgPoster').attr('src', imagenURL(p.primaryImage) || 'https://placehold.co/400x600?text=Sin+imagen');
  $('#titulo').text(p.primaryTitle);
  $('#anio').text(p.startYear);
  $('#duracion').text(p.runtimeMinutes ?? 'N/A');
  $('#clasificacion').text(p.contentRating || 'N/A');
  $('#rating').text(p.averageRating ?? 'N/A');
  $('#estrellas').html(estrellas(p.averageRating));
  $('#votos').text((p.numVotes ? p.numVotes.toLocaleString() : '0') + ' votos');
  $('#generos').empty();
  (p.genres || []).forEach(g => $('#generos').append(`<span class="badge bg-primary me-1">${g}</span>`));
  $('#descripcion').text(p.description || 'Sin sinopsis disponible.');
  $('#intereses').empty();
  (p.interests || []).forEach(i => $('#intereses').append(`<span class="badge bg-info text-dark me-1">${i}</span>`));

  if (p.metascore) {
    const color = p.metascore >= 70 ? 'bg-success' : (p.metascore >= 50 ? 'bg-warning' : 'bg-danger');
    $('#metascoreTexto').text(p.metascore);
    $('#barraMetascore').removeClass().addClass(color).css('width', p.metascore + '%');
  } else {
    $('#bloqueMetascore').addClass('d-none');
  }

  $('#idiomas').text(nombresDe(p.spokenLanguages) || 'N/A');
  $('#paises').text(nombresDe(p.countriesOfOrigin) || 'N/A');
  $('#presupuesto').text(formatearDinero(p.budget));
  $('#recaudacion').text(formatearDinero(p.grossWorldwide));
  $('#productoras').text(nombresDe(p.productionCompanies) || 'N/A');

  if (p.trailer) $('#btnTrailer').attr('href', p.trailer).removeClass('d-none');
  else $('#btnTrailer').addClass('d-none');

  $('#enlaces').empty();
  (p.externalLinks || []).forEach(url => {
    const href = url.startsWith('http') ? url : `https://${url}`;
    $('#enlaces').append(`<a href="${href}" target="_blank" class="d-block small">${url}</a>`);
  });

  actualizarBotonFavorito();
  $('#spinner').addClass('d-none');
  $('#contenido').removeClass('d-none').hide().fadeIn(600);
}

function actualizarBotonFavorito() {
  const fav = esFavorito(pelicula.id);
  $('#btnFavoritoDetalle').html(`<i class="bi ${fav ? 'bi-heart-fill' : 'bi-heart'}"></i> Favorito`);
}

function cargarPelicula() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { $('#spinner').addClass('d-none'); $('#error').removeClass('d-none'); return; }

  const settings = {
    async: true,
    crossDomain: true,
    url: `https://imdb236.p.rapidapi.com/api/imdb/${id}`,
    method: 'GET',
    headers: {
      'x-rapidapi-key': '3298c534e5msha0476afe9ce3d60p15e39ejsn054e5f0842e7',
      'x-rapidapi-host': 'imdb236.p.rapidapi.com',
      'Content-Type': 'application/json'
    }
  };

  $.ajax(settings)
    .done(function (response) {
      if (response && response.id) generarResena(response);
      else buscarEnJSON(id);
    })
    .fail(function () { buscarEnJSON(id); });
}

function buscarEnJSON(id) {
  $.getJSON('peliculas.json')
    .done(function (data) {
      const p = data.find(x => x.id === id);
      if (p) generarResena(p);
      else { $('#spinner').addClass('d-none'); $('#error').removeClass('d-none'); }
    })
    .fail(function () { $('#spinner').addClass('d-none'); $('#error').removeClass('d-none'); });
}

$(function () {
  cargarPelicula();
  $('#btnFavoritoDetalle').on('click', function () {
    alternarFavorito(pelicula);
    actualizarBotonFavorito();
  });
  $('#modalFavoritos').on('show.bs.modal', function () {
    $('#contadorFavoritos2').text(obtenerFavoritos().length);
  });
});
</script>
</body>
</html>
